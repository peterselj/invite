<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're Invited 🎉 — v3</title>
<style>
  :root {
    --mono-bg: #000; --mono-fg: #b8ffb8; --mono-dim: #4d7a4d;
    --accent: #ff5470; --accent2: #7c5cff; --gold: #ffd166; --bg: #14142b; --bg2: #23234a; --text: #f4f4f9; --muted: #a5a5c0;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family: 'Courier New', monospace; }
  body { background: var(--mono-bg); color: var(--mono-fg); transition: background 0.8s ease, color 0.8s ease; }
  body.decrypted { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  .scanlines { position: fixed; inset:0; z-index: 2; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    opacity: 0.5; transition: opacity 0.8s ease; }
  body.decrypted .scanlines { opacity: 0; }

  #app { position: relative; z-index: 1; height: 100vh; height: 100dvh; width: 100vw; display: flex; flex-direction: column; }
  .stage { flex: 1; position: relative; }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 22px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  .q-prompt { font-size: clamp(18px, 3.6vw, 28px); font-weight: 700; max-width: 680px; line-height: 1.5; margin-bottom: 26px; white-space: pre-wrap; }
  body.decrypted .q-prompt { font-size: clamp(22px, 4.2vw, 36px); font-weight: 800; }

  .choices { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 440px; }
  .choice { background: transparent; border: 1px solid var(--mono-dim); color: var(--mono-fg); padding: 12px 16px;
    font-family: inherit; font-size: 15px; text-align: left; cursor: pointer; }
  .choice:hover, .choice.selected { border-color: var(--mono-fg); background: rgba(184,255,184,0.08); }
  body.decrypted .choice { border: 2px solid rgba(255,255,255,0.15); border-radius: 12px; color: var(--text); background: rgba(255,255,255,0.05); padding: 16px 18px; font-family: -apple-system, sans-serif; }
  body.decrypted .choice:hover, body.decrypted .choice.selected { border-color: var(--accent); background: rgba(255,84,112,0.15); }

  .text-input { width: 100%; max-width: 420px; font-family: inherit; font-size: 18px; padding: 10px 4px; background: transparent;
    border: none; border-bottom: 1px solid var(--mono-dim); color: var(--mono-fg); outline: none; text-align: center; }
  body.decrypted .text-input { border-bottom: 2px solid rgba(255,255,255,0.3); color: var(--text); font-family: -apple-system, sans-serif; font-size: 20px; }

  .nav { display: flex; gap: 12px; margin-top: 26px; }
  .btn { border: 1px solid var(--mono-fg); background: transparent; color: var(--mono-fg); border-radius: 2px; padding: 10px 22px;
    font-family: inherit; font-size: 14px; cursor: pointer; }
  body.decrypted .btn { border-radius: 999px; font-family: -apple-system, sans-serif; font-weight: 700; }
  body.decrypted .btn-primary { background: var(--accent); color: white; border: none; }
  .btn-ghost { color: var(--mono-dim); border-color: var(--mono-dim); }
  body.decrypted .btn-ghost { color: var(--muted); border: none; }
  .hint { margin-top: 14px; color: var(--mono-dim); font-size: 12px; }
  body.decrypted .hint { color: var(--muted); }
  .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 8px; min-height: 16px; }

  /* slider scale */
  .slider-wrap { width: 100%; max-width: 420px; margin: 8px 0 4px; }
  .slider-wrap input[type=range] { width: 100%; }
  .slider-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--mono-dim); margin-top: 4px; }
  body.decrypted .slider-labels { color: var(--muted); }
  .slider-value { font-size: 16px; margin: 10px 0; font-weight: 700; }

  .decrypt-flash { position: fixed; inset: 0; z-index: 25; background: white; opacity: 0; pointer-events: none; }
  .decrypt-flash.flash { animation: flash 0.5s ease; }
  @keyframes flash { 0% { opacity: 0; } 30% { opacity: 0.9; } 100% { opacity: 0; } }

  .loading-bar-track { width: 280px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; margin: 18px 0; }
  .loading-bar-fill { height: 100%; width: 0%; background: var(--accent2); transition: width 0.3s ease; }
  .loading-pct { font-size: 14px; color: var(--muted); }

  .confirm-card { max-width: 460px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
    padding: 26px 28px; text-align: left; font-size: 15px; line-height: 1.7; }
  .confirm-card b { color: var(--gold); }
  .cal-buttons { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .cal-buttons a { text-decoration: none; background: rgba(255,209,102,0.15); border: 1px solid var(--gold); color: var(--gold);
    padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; }

  #confetti { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="decrypt-flash" id="decryptFlash"></div>
  <canvas id="confetti"></canvas>
  <div id="app"><div class="stage" id="stage"></div></div>

  <script>
    const EVENT = {
      title: "Peter's Birthday Party",
      location: 'The Green Room, Shaw Festival Theatre, Niagara-on-the-Lake',
      mapUrl: 'https://maps.app.goo.gl/dNC6DxQ9BVVo24WD8',
      startUTC: '20260914T223000Z', endUTC: '20260915T003000Z',
      humanWhen: 'Monday, September 14 · 6:30–8:30pm',
    };
    function googleCalUrl() {
      const p = new URLSearchParams({ action:'TEMPLATE', text: EVENT.title, dates: `${EVENT.startUTC}/${EVENT.endUTC}`,
        details: `Details: ${EVENT.mapUrl}`, location: EVENT.location });
      return `https://www.google.com/calendar/render?${p.toString()}`;
    }
    function icsUrl() {
      const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//birthday-invite//EN','BEGIN:VEVENT',
        `DTSTART:${EVENT.startUTC}`,`DTEND:${EVENT.endUTC}`,`SUMMARY:${EVENT.title}`,`LOCATION:${EVENT.location}`,
        `DESCRIPTION:${EVENT.mapUrl}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
      return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    }
    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyMU_miUBvTvIrY7I9KNEzbBiVLSQENPJVfQvpmZkhF0bGVAOzAcvUcg8HF-5IEXViv/exec';

    const START_ID = 'signal';
    const QUESTIONS = {
      signal: { type:'choice', prompt: '>> SIGNAL DETECTED.\n>> Do you accept transmission?',
        choices: ['accept', 'accept, nervously', 'this is how horror movies start'], next: 'designation' },
      designation: { type:'text', prompt: '>> State your designation (name):', next: 'decrypting' },
      decrypting: { type:'choice', prompt: '>> A birthday party has been detected at coordinates you are about to receive.\n>> Continue?',
        choices: ['continue', 'continue, faster', "I've made peace with this"], next: 'vibe', decryptAfter: true },
      vibe: { type:'slider', prompt: 'Drag to your current vibe:', lo: 'mortal enemy of fun', hi: 'unhinged party legend', next: 'analyzing' },
      analyzing: { type:'loading', next: 'attending' },
      attending: { type:'choice', prompt: 'Will you be there? (yes / no — the algorithm requires certainty, no maybes)',
        choices: ['yes', 'no'], next: null },
    };

    const stage = document.getElementById('stage');
    const answers = {};
    const history = [];
    let currentId = 'intro';
    let submitting = false;

    function render() {
      const el = buildScreen(currentId);
      const prev = stage.querySelector('.screen.active');
      stage.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.add('active');
        if (prev) { prev.classList.remove('active'); setTimeout(()=>prev.remove(),320); }
      });
      const af = el.querySelector('[data-autofocus]');
      if (af) setTimeout(()=>af.focus(),300);
    }

    function buildScreen(id) {
      const el = document.createElement('div');
      el.className = 'screen';

      if (id === 'intro') {
        el.innerHTML = `
          <div class="q-prompt">&gt;&gt; INCOMING TRANSMISSION...</div>
          <div class="nav"><button class="btn" id="startBtn">[ OPEN ]</button></div>
        `;
        el.querySelector('#startBtn').addEventListener('click', () => goTo(START_ID));
        return el;
      }

      if (id === 'thanks') {
        const yes = answers.attending === 'yes';
        el.innerHTML = `
          <div class="q-prompt">${yes ? 'COORDINATES CONFIRMED. 📡' : 'RESPONSE LOGGED. NO FURTHER ACTION NEEDED.'}</div>
          <div class="confirm-card">
            <div><b>${EVENT.title}</b></div>
            <div>${EVENT.humanWhen}</div>
            <div>${EVENT.location} — <a href="${EVENT.mapUrl}" target="_blank" style="color:var(--gold)">map</a></div>
            <div class="cal-buttons">
              <a href="${googleCalUrl()}" target="_blank">+ Google Calendar</a>
              <a href="${icsUrl()}" download="birthday-party.ics">⤓ .ics file</a>
            </div>
          </div>
        `;
        if (yes) setTimeout(burstConfetti, 150);
        return el;
      }

      const q = QUESTIONS[id];

      if (q.type === 'loading') {
        el.innerHTML = `
          <div class="q-prompt" id="loadPrompt">CALCULATING PARTY COMPATIBILITY...</div>
          <div class="loading-bar-track"><div class="loading-bar-fill" id="loadFill"></div></div>
          <div class="loading-pct" id="loadPct">0%</div>
        `;
        let pct = 0;
        const fill = el.querySelector('#loadFill');
        const pctEl = el.querySelector('#loadPct');
        const timer = setInterval(() => {
          pct += Math.random() * 18;
          if (pct >= 73) {
            pct = 73;
            clearInterval(timer);
            fill.style.width = '73%'; pctEl.textContent = '73%';
            setTimeout(() => {
              el.querySelector('#loadPrompt').textContent = '73%. JUST KIDDING — EVERYONE IS COMPATIBLE WITH CAKE.';
              setTimeout(() => advanceFrom(id), 1100);
            }, 300);
            return;
          }
          fill.style.width = pct + '%'; pctEl.textContent = Math.round(pct) + '%';
        }, 140);
        return el;
      }

      if (q.type === 'slider') {
        el.innerHTML = `
          <div class="q-prompt">${escapeHtml(q.prompt)}</div>
          <div class="slider-value" id="sliderValue">5 / 10</div>
          <div class="slider-wrap">
            <input type="range" min="0" max="10" value="5" id="sliderInput" data-autofocus />
            <div class="slider-labels"><span>${escapeHtml(q.lo)}</span><span>${escapeHtml(q.hi)}</span></div>
          </div>
          <div class="nav">
            <button class="btn btn-ghost" id="backBtn">Back</button>
            <button class="btn btn-primary" id="nextBtn">Next</button>
          </div>
        `;
        const input = el.querySelector('#sliderInput');
        const valueEl = el.querySelector('#sliderValue');
        answers[id] = answers[id] || '5';
        input.value = answers[id];
        valueEl.textContent = input.value + ' / 10';
        input.addEventListener('input', () => { answers[id] = input.value; valueEl.textContent = input.value + ' / 10'; });
        el.querySelector('#backBtn').addEventListener('click', goBack);
        el.querySelector('#nextBtn').addEventListener('click', () => advanceFrom(id));
        return el;
      }

      if (q.type === 'choice') {
        const choicesHtml = q.choices.map((c,i) => `<div class="choice" data-value="${escapeHtml(c)}" tabindex="0">[${indexToKey(i)}] ${escapeHtml(c)}</div>`).join('');
        el.innerHTML = `
          <div class="q-prompt">${escapeHtml(q.prompt)}</div>
          <div class="choices">${choicesHtml}</div>
          <div class="error-msg" id="errorMsg"></div>
          <div class="nav"><button class="btn btn-ghost" id="backBtn">Back</button></div>
          <div class="hint">keys ${q.choices.map((c,i)=>indexToKey(i)).join(' ')} also work</div>
        `;
        el.querySelectorAll('.choice').forEach(node => node.addEventListener('click', () => {
          answers[id] = node.dataset.value;
          node.classList.add('selected');
          setTimeout(() => {
            if (q.decryptAfter) decryptTransition(() => advanceFrom(id));
            else advanceFrom(id);
          }, 150);
        }));
        el.querySelector('#backBtn').addEventListener('click', goBack);
        return el;
      }

      // text
      el.innerHTML = `
        <div class="q-prompt">${escapeHtml(q.prompt)}</div>
        <input class="text-input" id="textInput" placeholder="..." data-autofocus value="${escapeAttr(answers[id]||'')}" />
        <div class="error-msg" id="errorMsg"></div>
        <div class="nav">
          <button class="btn btn-ghost" id="backBtn">Back</button>
          <button class="btn btn-primary" id="nextBtn">Next</button>
        </div>
        <div class="hint">press enter</div>
      `;
      el.querySelector('#textInput').addEventListener('keydown', e => { if (e.key==='Enter') attemptAdvance(el,id); });
      el.querySelector('#backBtn').addEventListener('click', goBack);
      el.querySelector('#nextBtn').addEventListener('click', () => attemptAdvance(el,id));
      return el;
    }

    // the big surprise: mid-flow visual switch from terminal to full color
    function decryptTransition(cb) {
      const flash = document.getElementById('decryptFlash');
      flash.classList.add('flash');
      setTimeout(() => { document.body.classList.add('decrypted'); }, 150);
      setTimeout(() => { flash.classList.remove('flash'); cb(); }, 550);
    }

    function indexToKey(i){ return String.fromCharCode(65+i); }
    function nextIdFor(id){ const q=QUESTIONS[id]; return typeof q.next==='function' ? q.next(answers[id]) : q.next; }
    function goTo(id){ history.push(id); currentId=id; render(); }
    function goBack(){ if (history.length<=1){ currentId='intro'; history.length=0; render(); return; } history.pop(); currentId=history[history.length-1]; render(); }
    function advanceFrom(id){ const nid=nextIdFor(id); if (nid) goTo(nid); else submitForm(); }
    function attemptAdvance(el,id){
      const ti = el.querySelector('#textInput');
      if (ti) answers[id]=ti.value.trim();
      if (!answers[id]) { el.querySelector('#errorMsg').textContent='>> INPUT REQUIRED'; return; }
      advanceFrom(id);
    }

    document.addEventListener('keydown', e => {
      if (e.metaKey||e.ctrlKey||e.altKey) return;
      const active = stage.querySelector('.screen.active');
      if (!active) return;
      const box = active.querySelector('.choices');
      if (!box) return;
      const key = e.key.toUpperCase();
      if (key.length!==1 || key<'A' || key>'Z') return;
      const nodes = Array.from(box.querySelectorAll('.choice'));
      const idx = key.charCodeAt(0)-65;
      if (idx>=0 && idx<nodes.length) nodes[idx].click();
    });

    function submitForm(){
      if (submitting) return; submitting = true;
      fetch(EXEC_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(answers) })
        .then(()=>{ submitting=false; goTo('thanks'); }).catch(()=>{ submitting=false; });
    }

    const canvas = document.getElementById('confetti'); const ctx = canvas.getContext('2d');
    let particles=[]; let raf=null;
    function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
    window.addEventListener('resize', resize); resize();
    const COLORS=['#ff5470','#7c5cff','#ffd166','#4dd4ac','#ffffff'];
    function burstConfetti(){
      for (let i=0;i<140;i++) particles.push({ x:canvas.width/2, y:canvas.height/3, vx:(Math.random()-0.5)*12, vy:(Math.random()-1.4)*12,
        size:4+Math.random()*5, color:COLORS[Math.floor(Math.random()*COLORS.length)], rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3, life:0, maxLife:90+Math.random()*40 });
      if (!raf) tick();
    }
    function tick(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p => { p.vy+=0.18; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
        ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.maxLife); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore(); });
      particles = particles.filter(p => p.life<p.maxLife);
      if (particles.length) raf=requestAnimationFrame(tick); else { raf=null; ctx.clearRect(0,0,canvas.width,canvas.height); }
    }

    function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

    render();
  </script>
</body>
</html>
