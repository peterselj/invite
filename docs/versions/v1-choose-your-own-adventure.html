<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're Invited 🎉 — v1</title>
<style>
  :root {
    --accent: #ffb703; --accent2: #fb8500; --pink: #ff5470;
    --bg: #0d1b2a; --bg2: #1b2a41; --text: #f4f4f9; --muted: #9fb3c8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 30% 10%, var(--bg2), var(--bg) 65%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app { position: relative; height: 100vh; height: 100dvh; width: 100vw; display: flex; flex-direction: column; }

  /* path map: little dots showing where you've branched */
  .pathmap { display: flex; gap: 6px; justify-content: center; padding: 14px 0 0; flex-shrink: 0; }
  .pathmap .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.3s ease, transform 0.3s ease; }
  .pathmap .dot.visited { background: var(--accent); transform: scale(1.3); }

  .stage { flex: 1; position: relative; }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px; text-align: center; opacity: 0; transform: translateY(24px) scale(0.98); pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .screen.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .screen.leaving { opacity: 0; transform: translateY(-24px) scale(0.98); }

  .q-prompt { font-size: clamp(22px, 4.2vw, 36px); font-weight: 800; max-width: 680px; line-height: 1.3; margin-bottom: 30px; }
  .q-sub { color: var(--muted); font-size: 15px; max-width: 540px; margin: -16px 0 24px; }

  /* hexagon-ish choice cards using clipped corners */
  .choices { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 620px; }
  .choice {
    position: relative;
    background: linear-gradient(160deg, rgba(255,183,3,0.12), rgba(251,133,0,0.05));
    border: 2px solid rgba(255,183,3,0.35);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    padding: 18px 22px; font-size: 16px; font-weight: 600; color: var(--text); cursor: pointer;
    min-width: 180px; max-width: 260px; text-align: left; transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .choice:hover { border-color: var(--accent); transform: translateY(-3px) rotate(-0.5deg); }
  .choice.selected { border-color: var(--accent); background: linear-gradient(160deg, rgba(255,183,3,0.3), rgba(251,133,0,0.15)); }
  .choice .k { display: block; font-size: 11px; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 6px; }

  .text-input {
    width: 100%; max-width: 440px; font-size: 20px; padding: 14px 4px; background: transparent; border: none;
    border-bottom: 2px solid rgba(255,255,255,0.25); color: var(--text); outline: none; text-align: center;
  }
  .text-input:focus { border-bottom-color: var(--accent); }

  .nav { display: flex; gap: 12px; margin-top: 32px; }
  .btn { border: none; border-radius: 10px; padding: 12px 26px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s ease; }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: #241800; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); }
  .hint { margin-top: 16px; color: var(--muted); font-size: 12px; }
  .error-msg { color: var(--pink); font-size: 13px; margin-top: 8px; min-height: 16px; }

  .title-sub { color: var(--muted); font-size: 16px; max-width: 500px; margin-bottom: 28px; }

  /* scale-of-ghosts widget */
  .ghost-scale { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 480px; margin-bottom: 10px; }
  .ghost {
    font-size: 26px; cursor: pointer; filter: grayscale(1) opacity(0.35); transition: filter 0.15s ease, transform 0.15s ease;
  }
  .ghost.lit { filter: grayscale(0) opacity(1); transform: scale(1.15); }
  .ghost-label { color: var(--muted); font-size: 13px; margin-top: 6px; }

  /* confirmation / calendar card */
  .confirm-card {
    max-width: 460px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,183,3,0.3);
    border-radius: 16px; padding: 26px 28px; text-align: left; font-size: 15px; line-height: 1.7;
  }
  .confirm-card b { color: var(--accent); }
  .cal-buttons { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .cal-buttons a {
    text-decoration: none; background: rgba(255,183,3,0.15); border: 1px solid var(--accent); color: var(--accent);
    padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
  }
  .cal-buttons a:hover { background: rgba(255,183,3,0.3); }

  /* the corner button */
  #dangerBtn {
    position: fixed; bottom: 18px; right: 18px; z-index: 20;
    background: #d00000; color: white; border: 2px solid #ff5c5c; border-radius: 999px;
    width: 64px; height: 64px; font-size: 10px; font-weight: 800; cursor: pointer; letter-spacing: 0.02em;
    box-shadow: 0 0 0 0 rgba(208,0,0,0.6); animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(208,0,0,0.5); } 50% { box-shadow: 0 0 0 10px rgba(208,0,0,0); } }
  .overlay {
    position: fixed; inset: 0; z-index: 30; background: rgba(10,10,20,0.94); display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 32px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: clamp(22px, 5vw, 34px); margin: 0; }
  .overlay p { color: var(--muted); max-width: 440px; }

  #confetti { position: fixed; inset: 0; z-index: 15; pointer-events: none; }
</style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div id="app">
    <div class="pathmap" id="pathmap"></div>
    <div class="stage" id="stage"></div>
  </div>
  <button id="dangerBtn">DO NOT<br>PRESS</button>
  <div class="overlay" id="overlay">
    <h2>👁️ You pressed it.</h2>
    <p id="overlayMsg"></p>
    <button class="btn btn-primary" id="overlayClose">Back to safety</button>
  </div>

  <script>
    // ---- EVENT DETAILS (used on the final confirmation screen) ----
    const EVENT = {
      title: "Peter's Birthday Party",
      location: 'The Green Room, Shaw Festival Theatre, Niagara-on-the-Lake',
      mapUrl: 'https://maps.app.goo.gl/dNC6DxQ9BVVo24WD8',
      // Sept 14, 6:30–8:30pm ET. EDT = UTC-4 in September.
      startUTC: '20260914T223000Z',
      endUTC: '20260915T003000Z',
      humanWhen: 'Monday, September 14 · 6:30–8:30pm',
    };
    function googleCalUrl() {
      const p = new URLSearchParams({ action: 'TEMPLATE', text: EVENT.title, dates: `${EVENT.startUTC}/${EVENT.endUTC}`,
        details: `Details: ${EVENT.mapUrl}`, location: EVENT.location });
      return `https://www.google.com/calendar/render?${p.toString()}`;
    }
    function icsUrl() {
      const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//birthday-invite//EN','BEGIN:VEVENT',
        `DTSTART:${EVENT.startUTC}`, `DTEND:${EVENT.endUTC}`, `SUMMARY:${EVENT.title}`,
        `LOCATION:${EVENT.location}`, `DESCRIPTION:${EVENT.mapUrl}`, 'END:VEVENT','END:VCALENDAR'].join('\r\n');
      return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    }

    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyMU_miUBvTvIrY7I9KNEzbBiVLSQENPJVfQvpmZkhF0bGVAOzAcvUcg8HF-5IEXViv/exec';

    const START_ID = 'note';
    const QUESTIONS = {
      note: {
        type: 'choice',
        prompt: 'A folded note appears under your door. It smells faintly of birthday cake and mild threat.',
        choices: ['read it immediately', 'sniff it first, obviously', 'call the authorities'],
        next: (v) => v === 'sniff it first, obviously' ? 'sniff' : 'threat',
      },
      sniff: {
        type: 'choice',
        prompt: 'You inhale deeply. The note smells like:',
        choices: ['nostalgia', 'a Duraflame log', "your ex's cologne", 'cake, still, somehow'],
        next: 'threat',
      },
      threat: {
        type: 'choice',
        prompt: "The note reads: \"Be there, or else.\" The \"or else\" is probably",
        choices: ['a strongly worded follow-up text', 'nothing, I have no leverage', 'a personal appearance at your house', 'several personal appearances'],
        next: 'ghosts',
      },
      ghosts: {
        type: 'scale',
        prompt: 'On a scale of 1 to 10 ghosts, how spooked are you by this level of commitment to a bit?',
        icon: '👻', max: 10,
        next: 'form',
      },
      form: {
        type: 'choice',
        prompt: 'You decide your final form for the night will be:',
        choices: ['a responsible adult', 'a slightly-too-loud adult', 'a cryptid who only appears near the bar', 'undecided, evolving in real time'],
        next: 'name',
      },
      name: { type: 'text', prompt: 'What should we call you on the list at the door?', next: 'attending' },
      attending: {
        type: 'choice',
        prompt: 'Will you be there?',
        choices: ['yes, obviously', "no, and I'll explain later"],
        next: null,
      },
    };
    const PATH_ORDER = ['note','sniff','threat','ghosts','form','name','attending']; // for the dot map (sniff may be skipped)

    const stage = document.getElementById('stage');
    const answers = {};
    const history = [];
    let currentId = 'intro';
    let submitting = false;

    function updatePathmap() {
      const map = document.getElementById('pathmap');
      map.innerHTML = '';
      PATH_ORDER.forEach(id => {
        const d = document.createElement('div');
        d.className = 'dot' + (history.includes(id) ? ' visited' : '');
        map.appendChild(d);
      });
    }

    function render() {
      updatePathmap();
      const el = buildScreen(currentId);
      const prev = stage.querySelector('.screen.active');
      stage.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.add('active');
        if (prev) { prev.classList.remove('active'); prev.classList.add('leaving'); setTimeout(() => prev.remove(), 400); }
      });
      const af = el.querySelector('[data-autofocus]');
      if (af) setTimeout(() => af.focus(), 350);
    }

    function buildScreen(id) {
      const el = document.createElement('div');
      el.className = 'screen';

      if (id === 'intro') {
        el.innerHTML = `
          <div class="q-prompt">You're invited! 🎉</div>
          <div class="title-sub">This one's a choose-your-own-adventure. Choices branch. Some paths are shorter than others. Good luck.</div>
          <div class="nav"><button class="btn btn-primary" id="startBtn">Begin</button></div>
        `;
        el.querySelector('#startBtn').addEventListener('click', () => goTo(START_ID));
        return el;
      }

      if (id === 'thanks') {
        const yes = answers.attending === 'yes, obviously';
        el.innerHTML = `
          <div class="q-prompt">${yes ? "You're on the list! 🎉" : "Noted — no hard feelings. 💌"}</div>
          <div class="confirm-card">
            <div><b>${EVENT.title}</b></div>
            <div>${EVENT.humanWhen}</div>
            <div>${EVENT.location} — <a href="${EVENT.mapUrl}" target="_blank" style="color:var(--accent)">map</a></div>
            <div class="cal-buttons">
              <a href="${googleCalUrl()}" target="_blank">+ Google Calendar</a>
              <a href="${icsUrl()}" download="birthday-party.ics">⤓ .ics file</a>
            </div>
          </div>
        `;
        if (yes) setTimeout(burstConfetti, 150);
        return el;
      }

      const q = QUESTIONS[id];
      const required = true;

      if (q.type === 'scale') {
        let items = '';
        for (let i = 1; i <= q.max; i++) items += `<span class="ghost" data-v="${i}">${q.icon}</span>`;
        el.innerHTML = `
          <div class="q-prompt">${escapeHtml(q.prompt)}</div>
          <div class="ghost-scale">${items}</div>
          <div class="ghost-label" id="ghostLabel">pick a number</div>
          <div class="nav">
            <button class="btn btn-ghost" id="backBtn">Back</button>
            <button class="btn btn-primary" id="nextBtn" disabled>Next</button>
          </div>
        `;
        const ghosts = Array.from(el.querySelectorAll('.ghost'));
        ghosts.forEach(g => g.addEventListener('click', () => {
          const v = Number(g.dataset.v);
          ghosts.forEach(x => x.classList.toggle('lit', Number(x.dataset.v) <= v));
          answers[id] = String(v);
          el.querySelector('#ghostLabel').textContent = v + ' / ' + q.max + ' ghosts';
          el.querySelector('#nextBtn').disabled = false;
        }));
        el.querySelector('#backBtn').addEventListener('click', goBack);
        el.querySelector('#nextBtn').addEventListener('click', () => advanceFrom(id));
        return el;
      }

      if (q.type === 'choice') {
        const choicesHtml = q.choices.map((c, i) => `
          <div class="choice" data-value="${escapeHtml(c)}" tabindex="0"><span class="k">${indexToKey(i)}</span>${escapeHtml(c)}</div>
        `).join('');
        el.innerHTML = `
          <div class="q-prompt">${escapeHtml(q.prompt)}</div>
          <div class="choices">${choicesHtml}</div>
          <div class="error-msg" id="errorMsg"></div>
          <div class="nav">
            <button class="btn btn-ghost" id="backBtn">Back</button>
            <button class="btn btn-primary" id="nextBtn" disabled>${q.next === null ? 'Submit' : 'Next'}</button>
          </div>
          <div class="hint">Press ${q.choices.map((c,i)=>indexToKey(i)).join(', ')} — or click</div>
        `;
        el.querySelectorAll('.choice').forEach(node => {
          node.addEventListener('click', () => {
            el.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
            node.classList.add('selected');
            answers[id] = node.dataset.value;
            el.querySelector('#nextBtn').disabled = false;
            setTimeout(() => advanceFrom(id), 160);
          });
        });
        el.querySelector('#backBtn').addEventListener('click', goBack);
        el.querySelector('#nextBtn').addEventListener('click', () => attemptAdvance(el, id));
        return el;
      }

      // text
      el.innerHTML = `
        <div class="q-prompt">${escapeHtml(q.prompt)}</div>
        <input class="text-input" id="textInput" placeholder="Type here..." data-autofocus value="${escapeAttr(answers[id]||'')}" />
        <div class="error-msg" id="errorMsg"></div>
        <div class="nav">
          <button class="btn btn-ghost" id="backBtn">Back</button>
          <button class="btn btn-primary" id="nextBtn">${q.next === null ? 'Submit' : 'Next'}</button>
        </div>
        <div class="hint">Press Enter ↵</div>
      `;
      el.querySelector('#textInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptAdvance(el, id); });
      el.querySelector('#backBtn').addEventListener('click', goBack);
      el.querySelector('#nextBtn').addEventListener('click', () => attemptAdvance(el, id));
      return el;
    }

    function indexToKey(i) { return String.fromCharCode(65 + i); }

    function nextIdFor(id) {
      const q = QUESTIONS[id];
      return typeof q.next === 'function' ? q.next(answers[id]) : q.next;
    }
    function goTo(id) { history.push(id); currentId = id; render(); }
    function goBack() {
      if (history.length <= 1) { currentId = 'intro'; history.length = 0; render(); return; }
      history.pop(); currentId = history[history.length - 1]; render();
    }
    function advanceFrom(id) {
      const nid = nextIdFor(id);
      if (nid) goTo(nid); else submitForm();
    }
    function attemptAdvance(el, id) {
      const textInput = el.querySelector('#textInput');
      if (textInput) answers[id] = textInput.value.trim();
      if (!answers[id]) { el.querySelector('#errorMsg').textContent = "Need something here — go on."; return; }
      advanceFrom(id);
    }

    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const active = stage.querySelector('.screen.active');
      if (!active) return;
      const choicesBox = active.querySelector('.choices');
      if (!choicesBox) return;
      const key = e.key.toUpperCase();
      if (key.length !== 1 || key < 'A' || key > 'Z') return;
      const nodes = Array.from(choicesBox.querySelectorAll('.choice'));
      const idx = key.charCodeAt(0) - 65;
      if (idx >= 0 && idx < nodes.length) nodes[idx].click();
    });

    function submitForm() {
      if (submitting) return;
      submitting = true;
      fetch(EXEC_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(answers) })
        .then(() => { submitting = false; goTo('thanks'); })
        .catch(() => { submitting = false; });
    }

    // ---- the corner button: a visible, always-available surprise ----
    const DANGER_MESSAGES = [
      "Legend says nothing happens. Legend is right. (Confetti anyway.)",
      "Congratulations, you now own this decision forever.",
      "This button does nothing. You did this to yourself.",
      "In an alternate universe, this cancels the party. Not this one.",
    ];
    document.getElementById('dangerBtn').addEventListener('click', () => {
      document.getElementById('overlayMsg').textContent = DANGER_MESSAGES[Math.floor(Math.random()*DANGER_MESSAGES.length)];
      document.getElementById('overlay').classList.add('show');
      burstConfetti();
    });
    document.getElementById('overlayClose').addEventListener('click', () => {
      document.getElementById('overlay').classList.remove('show');
    });

    // ---- confetti (small self-contained canvas burst) ----
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let particles = []; let raf = null;
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    window.addEventListener('resize', resize); resize();
    const COLORS = ['#ffb703','#fb8500','#ff5470','#8ecae6','#ffffff'];
    function burstConfetti() {
      for (let i=0;i<130;i++) particles.push({
        x: canvas.width/2, y: canvas.height/3, vx:(Math.random()-0.5)*12, vy:(Math.random()-1.4)*12,
        size:4+Math.random()*5, color: COLORS[Math.floor(Math.random()*COLORS.length)], rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3, life:0, maxLife:90+Math.random()*40,
      });
      if (!raf) tick();
    }
    function tick() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p => { p.vy+=0.18; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
        ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.maxLife); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore(); });
      particles = particles.filter(p => p.life < p.maxLife);
      if (particles.length) raf = requestAnimationFrame(tick); else { raf=null; ctx.clearRect(0,0,canvas.width,canvas.height); }
    }

    function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

    render();
  </script>
</body>
</html>
