<style>
  :root {
    --accent: #ff5470;
    --bg: #1b1b2f;
    --bg2: #262640;
    --text: #f4f4f9;
    --muted: #a5a5c0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(160deg, var(--bg), var(--bg2));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  #app {
    position: relative;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
  }

  .progress-track {
    height: 6px;
    width: 100%;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.35s ease;
  }

  .stage {
    flex: 1;
    position: relative;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
    opacity: 0;
    transform: translateY(24px);
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .screen.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .screen.leaving {
    opacity: 0;
    transform: translateY(-24px);
  }

  .q-index {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .q-prompt {
    font-size: clamp(22px, 4.5vw, 38px);
    font-weight: 700;
    max-width: 720px;
    line-height: 1.25;
    margin-bottom: 32px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 480px;
  }

  .choice {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 17px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .choice:hover { border-color: var(--accent); background: rgba(255,84,112,0.12); }
  .choice.selected { border-color: var(--accent); background: rgba(255,84,112,0.22); }
  .choice:active { transform: scale(0.98); }

  .choice-key {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 2px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }

  .text-input {
    width: 100%;
    max-width: 480px;
    font-size: 20px;
    padding: 14px 4px;
    background: transparent;
    border: none;
    border-bottom: 2px solid rgba(255,255,255,0.25);
    color: var(--text);
    outline: none;
    text-align: center;
  }
  .text-input:focus { border-bottom-color: var(--accent); }
  .text-input::placeholder { color: var(--muted); }

  .optional-tag {
    color: var(--muted);
    font-size: 13px;
    margin-top: 10px;
  }

  .nav {
    display: flex;
    gap: 12px;
    margin-top: 36px;
  }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); }

  .hint {
    margin-top: 18px;
    color: var(--muted);
    font-size: 13px;
  }

  .title-screen .q-prompt { font-size: clamp(28px, 6vw, 48px); }
  .title-sub {
    color: var(--muted);
    font-size: 17px;
    max-width: 520px;
    margin-bottom: 32px;
  }

  .error-msg {
    color: var(--accent);
    font-size: 14px;
    margin-top: 10px;
    min-height: 18px;
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
